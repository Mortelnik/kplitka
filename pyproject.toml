[project]
name = "kp-plugin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-docx>=1.1",
    "docxtpl>=0.16",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
